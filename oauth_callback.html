<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OAuth Callback</title>
</head>
<body>
<script>
(function(){
  function parseQuery(q){
    var params={};
    (q.replace(/^\?/,'')).split('&').forEach(function(p){
      if(!p) return;
      var parts = p.split('=');
      params[decodeURIComponent(parts[0])] = decodeURIComponent((parts[1]||'').replace(/\+/g,' '));
    });
    return params;
  }

  var params = {};
  if(location.search && location.search.length>1) params = parseQuery(location.search);
  else if(location.hash && location.hash.length>1) params = parseQuery(location.hash.replace(/^#/, '?'));

  var payload = { params: params };
  try{
    if(params.state){
      try{ payload.state = params.state; payload.stateObj = JSON.parse(decodeURIComponent(escape(atob(params.state)))); }catch(e){}
    }
    if(payload.stateObj && payload.stateObj.provider) payload.provider = payload.stateObj.provider;
  }catch(e){}

  // send to opener window
  if(window.opener && !window.opener.closed){
    window.opener.postMessage({ provider: payload.provider, state: params.state, code: params.code, params: params }, '*');
  }

  // optional display for debugging
  document.body.innerHTML = '<pre style="white-space:pre-wrap">Received OAuth response. You can close this window.</pre>';

  // close after a short delay
  setTimeout(function(){ try{ window.close(); }catch(e){} }, 800);
})();
</script>
</body>
</html>
